services:
    namenode:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: namenode
        container_name: namenode
        command: ["hdfs", "namenode"]
        ports:
            - "9870:9870" # NameNode Web UI
            - "8020:8020" # HDFS RPC
        env_file: ./hadoop.env
        environment:
            - ENSURE_NAMENODE_DIR=/data/name/current
        volumes:
            - namenode_data:/data

    datanode:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: datanode
        container_name: datanode
        command: ["hdfs", "datanode"]
        env_file: ./hadoop.env
        depends_on:
            - namenode
        volumes:
            - datanode_data:/data

    resourcemanager:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: resourcemanager
        container_name: resourcemanager
        command: ["yarn", "resourcemanager"]
        ports:
            - "8088:8088" # YARN Web UI
        env_file: ./hadoop.env
        depends_on:
            - namenode
            - datanode

    nodemanager:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: nodemanager
        container_name: nodemanager
        command: ["yarn", "nodemanager"]
        env_file: ./hadoop.env
        depends_on:
            - resourcemanager

    hive-server:
        image: apache/hive:3.1.3
        platform: linux/amd64
        hostname: hive-server
        container_name: hive-server
        env_file: ./hadoop.env
        depends_on:
            - namenode
            - datanode
        environment:
            SERVICE_NAME: metastore
            IS_RESUME: "false"
            HADOOP_CLASSPATH: "/opt/tez/*:/opt/tez/lib/*:"
        volumes:
            - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
        ports:
            - "9083:9083" # Hive Metastore Thrift
            - "10000:10000" # HiveServer2 JDBC/CLI
            - "10002:10002" # Hive Web UI

volumes:
    namenode_data:
    datanode_data:
